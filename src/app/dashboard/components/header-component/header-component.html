<header class="flex flex-row items-center justify-between h-[8vh] w-full px-4 shadow-md">
  <div class="flex flex-row items-center gap-2">
    <div class="join w-full max-w-lg">
      <label class="input input-bordered join-item flex-1 min-w-0">
        <svg class="h-[1em] opacity-50 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </g>
        </svg>
        <input
          type="search"
          class="grow min-w-0"
          placeholder="Buscar dirección…"
          #searchInput
          (keydown.enter)="buscarDireccion()"
        />
      </label>
      <button
        class="btn btn-primary join-item"
        (click)="buscarDireccion()"
        [disabled]="geocoderService.searching()"
      >
        @if (geocoderService.searching()) {
          <span class="loading loading-spinner loading-sm"></span>
        }
        Buscar
      </button>
    </div>

    <button
      class="btn btn-outline shrink-0"
      type="button"
      (click)="limpiarMapa()"
      [disabled]="geocoderService.searching()"
    >
      Limpiar mapa
    </button>

    <button
      class="btn btn-secondary shrink-0"
      type="button"
      (click)="abrirEvaluacion()"
      [disabled]="geocoderService.searching()"
    >
      Evaluar Geocoders
    </button>
  </div>

  <h1 class="font-bold text-2xl">GeocoderApp</h1>
</header>

<app-geocoder-eval-modal
  [open]="evalModalOpen()"
  (closed)="cerrarEvaluacion()"
/>
