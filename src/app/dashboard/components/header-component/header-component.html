<header class="flex flex-row items-center justify-between h-[8vh] w-full px-4 shadow-md">
  <div class="flex flex-row items-center gap-2 flex-wrap">
    <select
      class="select select-bordered select-sm max-w-[11rem]"
      [value]="geocoderService.selectedId()"
      (change)="onGeocoderChange($event)"
      aria-label="Geocoder"
    >
      @for (opt of geocoderService.options; track opt.id) {
        <option [value]="opt.id">{{ opt.label }}</option>
      }
    </select>

    <label class="input">
      <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g
          stroke-linejoin="round"
          stroke-linecap="round"
          stroke-width="2.5"
          fill="none"
          stroke="currentColor"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </g>
      </svg>
      <input
        type="search"
        class="grow"
        placeholder="Buscar dirección…"
        #searchInput
        (keydown.enter)="buscarDireccion()"
      />
    </label>

    <button
      class="btn btn-primary"
      (click)="buscarDireccion()"
      [disabled]="geocoderService.searching()"
    >
      @if (geocoderService.searching()) {
        <span class="loading loading-spinner loading-sm"></span>
      }
      Buscar
    </button>
  </div>

  <h1 class="font-bold text-2xl">GeocoderApp</h1>
</header>
