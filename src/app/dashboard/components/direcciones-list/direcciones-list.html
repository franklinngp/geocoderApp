<aside class="flex h-full min-h-0 w-72 flex-col border-r border-white/10 bg-base-200">
  <div class="shrink-0 border-b border-white/10 px-3 py-3">
    <h2 class="text-base font-bold">Direcciones</h2>
    <p class="text-sm text-base-content/60">{{ direcciones.length }} puntos</p>
  </div>

  <ul class="min-h-0 flex-1 overflow-y-auto p-2">
    @for (item of direcciones; track item.id) {
      <li>
        <button
          type="button"
          class="btn btn-ghost h-auto min-h-0 w-full justify-start whitespace-normal py-3 text-left text-base font-normal"
          [class.btn-active]="selectedId() === item.id"
          [disabled]="geocoderService.searching()"
          (click)="onSelect(item)"
        >
          <span class="block w-full font-medium leading-snug">{{ item.name }}</span>
          <span class="mt-1 block w-full font-mono text-sm text-base-content/60">
            {{ item.lat.toFixed(5) }}, {{ item.lon.toFixed(5) }}
          </span>
        </button>
      </li>
    }
  </ul>
</aside>
